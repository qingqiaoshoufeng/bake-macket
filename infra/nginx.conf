# TLS 在外层负载均衡器或入口代理终止。H5 与 Admin 使用两个域名，分别转发到 8080/8081。
# 本文件作为 /etc/nginx/conf.d/default.conf 加载。
# 公网客户端不可决定请求 ID：当前示例始终用 Nginx $request_id 重发给 API 和响应。
# 受信任外层入口若需跨层关联，须在其网络边界配置并覆盖头；不得直接信任客户端头。
# 例如 attacker-123 仅是客户端输入，绝不会成为 API 或响应的 X-Request-Id。
map $request_id $bake_mall_request_id {
  default $request_id;
}

upstream bake_mall_api {
  server api:3000;
  keepalive 32;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html/h5;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Request-Id $bake_mall_request_id always;

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-Id $bake_mall_request_id;
    proxy_pass http://bake_mall_api;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 8081;
  listen [::]:8081;
  server_name _;
  root /usr/share/nginx/html/admin;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Request-Id $bake_mall_request_id always;

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-Id $bake_mall_request_id;
    proxy_pass http://bake_mall_api;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
