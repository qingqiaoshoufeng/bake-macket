services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bake_mall
      MYSQL_USER: bake_app
      MYSQL_PASSWORD: bake_app_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports: ['127.0.0.1:3306:3306']
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/bake-mall && mc anonymous set download local/bake-mall

volumes:
  mysql_data:
  minio_data:
